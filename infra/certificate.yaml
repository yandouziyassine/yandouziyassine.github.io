AWSTemplateFormatVersion: "2010-09-09"
Description: Portfolio TLS certificate for CloudFront (deploy in us-east-1, the only region CloudFront accepts)
Parameters:
  DomainName:
    Type: String
    Description: "e.g. yassineyandouzi.dev"
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZoneId }
Outputs:
  CertificateArn:
    Value: !Ref Certificate
