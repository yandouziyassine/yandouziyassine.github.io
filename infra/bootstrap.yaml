AWSTemplateFormatVersion: "2010-09-09"
Description: Portfolio bootstrap - GitHub OIDC deploy role and budget alerts (deploy in us-east-1)
Parameters:
  GitHubRepo:
    Type: String
    Default: yandouziyassine/yandouziyassine.github.io
  BucketName:
    Type: String
    Description: Name the site bucket will have (same value as in site.yaml)
  AlertEmail:
    Type: String
    Description: Where AWS sends budget alerts (passed at deploy time, never stored in the repo)
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike: { "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/main" }
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:aws:s3:::${BucketName}
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub arn:aws:s3:::${BucketName}/*
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: portfolio-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 20, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25 }   # $5
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100 }  # $20
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
