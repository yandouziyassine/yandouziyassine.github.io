<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs>
  <pattern id="yd" width="96" height="675" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="675" stroke="#1d2a1f" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="675" fill="#0d0e10"/>
<rect x="60" y="70" width="1080" height="520" fill="#101712"/>
<rect x="60" y="70" width="1080" height="520" fill="url(#yd)"/>
