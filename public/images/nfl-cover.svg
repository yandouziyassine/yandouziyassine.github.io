<text x="60" y="635" font-family="'Instrument Serif', Georgia, serif" font-size="38" fill="#ecebe6">Combine 40-yard dash at 10 Hz</text>
<text x="1140" y="635" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" fill="#6f6e6a">schematic · not competition data</text>
