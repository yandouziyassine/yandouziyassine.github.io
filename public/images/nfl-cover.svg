<!-- fast starter vs slow starter, same top speed (schematic) -->
<path d="M140 530 C 200 330, 260 250, 360 225 S 700 205, 1100 200" fill="none" stroke="#ff5b1f" stroke-width="6" stroke-linecap="round"/>
<path d="M140 530 C 260 470, 330 340, 450 260 S 760 208, 1100 202" fill="none" stroke="#ecebe6" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>
<circle cx="330" cy="239" r="9" fill="#ff5b1f"/>
<circle cx="330" cy="372" r="8" fill="#ecebe6"/>
<text x="560" y="180" font-family="'Geist Mono', ui-monospace, monospace" font-size="20" fill="#ff5b1f">quick first step</text>
